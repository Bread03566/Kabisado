<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Kabisado</title>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b; --accent:#f59e0b; --accent-dark:#d97706; --line:#e2e8f0; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --line:#334155; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width:100%; max-width:26rem; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:32px 24px; }
    .owl { font-size:64px; line-height:1; animation: bob 2.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .owl { animation:none; } }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    h1 { margin:12px 0 4px; font-size:1.35rem; }
    p { margin:6px 0; color:var(--muted); font-size:.95rem; line-height:1.45; }
    .bar { height:6px; margin:20px 0 8px; border-radius:99px; background:var(--line); overflow:hidden; }
    .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width 1s linear; }
    .actions { margin-top:16px; display:none; gap:8px; justify-content:center; flex-wrap:wrap; }
    button, a.btn { font:inherit; font-weight:700; font-size:.9rem; padding:10px 16px; border-radius:12px; border:0; cursor:pointer; text-decoration:none; }
    button { background:var(--accent); color:#fff; }
    button:hover { background:var(--accent-dark); }
    a.btn { background:transparent; color:var(--text); border:1px solid var(--line); }
    :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  </style>
</head>
<body>
  <main>
    <div class="owl" aria-hidden="true">🦉</div>
    <h1 id="title">Kabi is waking up…</h1>
    <p id="msg">Our server is on a free plan, so it sleeps when nobody is using it. Please wait a moment; it is usually under a minute.</p>
    <div class="bar" role="progressbar" aria-label="Waking the server" aria-valuemin="0" aria-valuemax="90" aria-valuenow="0"><i id="fill"></i></div>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="actions" id="actions">
      <button type="button" id="retry">Try again</button>
      <a class="btn" id="open" href="__API_ORIGIN__/">Open anyway</a>
    </div>
    <noscript><p>This page needs JavaScript. <a href="__API_ORIGIN__/">Click here to open Kabisado directly.</a></p></noscript>
  </main>

  <script>
    (function () {
      var API = "__API_ORIGIN__";
      var INTERVAL_MS = 3000, CEILING_MS = 90000;
      var started, timer, ticker, done;
      var $ = function (id) { return document.getElementById(id); };

      function setProgress(ms) {
        var s = Math.min(90, Math.round(ms / 1000));
        $("fill").style.width = (s / 90 * 100) + "%";
        $("fill").parentNode.setAttribute("aria-valuenow", String(s));
      }

      function giveUp() {
        done = true; clearTimeout(timer); clearInterval(ticker);
        $("title").textContent = "Kabi is still sleepy";
        $("msg").textContent = "The server is still not answering. Please try again in a little while.";
        $("status").textContent = "";
        $("actions").style.display = "flex";
      }

      function ready() {
        done = true; clearTimeout(timer); clearInterval(ticker);
        setProgress(90000);
        $("title").textContent = "Kabi is awake!";
        $("status").textContent = "Taking you there…";
        window.location.replace(API + "/");
      }

      function check() {
        if (done) return;
        var elapsed = Date.now() - started;
        if (elapsed >= CEILING_MS) return giveUp();
        var ctl = new AbortController();
        var abort = setTimeout(function () { ctl.abort(); }, 8000);
        fetch(API + "/api/health", { cache: "no-store", credentials: "omit", signal: ctl.signal })
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (body) { if (body && body.status === "healthy") ready(); else next(); })
          .catch(next)
          .then(function () { clearTimeout(abort); });
      }

      function next() { if (!done) timer = setTimeout(check, INTERVAL_MS); }

      function start() {
        done = false; started = Date.now();
        $("title").textContent = "Kabi is waking up…";
        $("msg").textContent = "Our server is on a free plan, so it sleeps when nobody is using it. Please wait a moment; it is usually under a minute.";
        $("actions").style.display = "none";
        setProgress(0);
        clearInterval(ticker);
        ticker = setInterval(function () {
          var e = Date.now() - started;
          setProgress(e);
          $("status").textContent = "Waiting… " + Math.round(e / 1000) + " s";
        }, 1000);
        check();
      }

      $("retry").addEventListener("click", start);
      start();
    })();
  </script>
</body>
</html>
