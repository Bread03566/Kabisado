services:
  - type: web
    name: kabisado-api
    runtime: docker
    rootDir: backend
    plan: free               # free: data resets on redeploy/restart, server sleeps when idle
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # you paste this in the Render dashboard
      - key: DEBUG
        value: "false"
